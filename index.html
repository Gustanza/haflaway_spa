    <!-- Playfair Display carries all display/serif type (greetings, event titles,
         stat numerals). Loaded at 400-700 + italic: it's a high-contrast face, so
         the heavier weights are what keep hairlines from thinning out on the dark
         backdrop. Inter handles all UI text.

         Cormorant Garamond + Great Vibes are the landing page's wedding pairing.
         Great Vibes is a script: it is used for decorative display words at 2rem
         and above only — never for UI, labels or body copy, where a script face
         is unreadable. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Great+Vibes&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
