<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haflaway</title>
    <meta name="theme-color" content="#ffffff" />
    <script>
      /* Canvas color before first paint. Organizer hub is white paper; guest
         event pages are ivory; only auth screens stay dark. Elastic overscroll
         and refresh both reveal html/body, so this must match the page. */
      (function () {
        var p = location.pathname;
        var dark = p === '/login' || p === '/register' || p === '/select-org';
        var guest = /^\/events\/[^/]+\/[^/]+/.test(p);
        var landing = p === '/' || p === '/pricing';
        var bg = dark ? '#0a0a0b' : guest ? '#FAF6EF' : landing ? '#FAFAFA' : '#ffffff';
        document.documentElement.style.background = bg;
        document.documentElement.style.color = dark ? '#f0f0ec' : '#1D1D1F';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute('content', bg);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Opens the TLS connection to Firebase's services while the JS bundle is
         still downloading/parsing, instead of only starting DNS+TCP+TLS after
         the app has booted and made its first Firestore/Storage/Auth call. -->
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
    <!-- Playfair Display carries all display/serif type (greetings, event titles,
         stat numerals). Loaded at 400-700 + italic: it's a high-contrast face, so
         the heavier weights are what keep hairlines from thinning out on the dark
         backdrop. Inter handles all UI text.

         Cormorant Garamond + Great Vibes are the landing page's wedding pairing.
         Great Vibes is a script: it is used for decorative display words at 2rem
         and above only — never for UI, labels or body copy, where a script face
         is unreadable. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Great+Vibes&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
